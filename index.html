<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INFONIC 2026 &bull; A Place to Belong, A Place to Become</title>
  
  <!-- Primary Meta Tags & SEO -->
  <meta name="title" content="INFONIC 2026 - A Place to Belong, A Place to Become">
  <meta name="description" content="Website Resmi Orientasi & Pembekalan Mahasiswa Baru Informatika UIN Sunan Kalijaga Yogyakarta 2026.">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">

  <!-- Preload Critical Above-The-Fold LCP Image -->
  <link rel="preload" as="image" href="assets/logo.webp" type="image/webp" fetchpriority="high">

  <!-- Google Fonts: Plus Jakarta Sans with font-display=swap -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Main Modular Stylesheet -->
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <!-- Stardust Top Background Layer -->
  <div class="stardust-top-layer" aria-hidden="true"></div>

  <!-- Parallax Background Assets -->
  <div class="parallax-container" aria-hidden="true">
    <!-- 1. Lapisan Atas (Header & Filosofi) - Awan Transisi Merapat -->
    
    <!-- 1.5. Awan Transisi Filosofi (Pembatas yang merapat saat scroll ke bawah) -->
    <img src="assets/background/awan.webp" class="parallax-asset atmos awan-filosofi-kiri size-xl awan-dark" alt="" width="480" height="240" loading="lazy" decoding="async" />
    <img src="assets/background/awan.webp" class="parallax-asset atmos awan-filosofi-kanan size-xl awan-dark" data-flip="true" style="transform: scaleX(-1);" alt="" width="480" height="240" loading="lazy" decoding="async" />

    <!-- 2. Lapisan Tengah (Timeline, Gugus & Materi) -->
    <!-- Awan Timeline Kanan Atas -->
    <img src="assets/background/awan.webp" class="parallax-asset atmos size-lg awan-dark awan-timeline-top" data-flip="true" style="transform: scaleX(-1);" alt="" width="400" height="200" loading="lazy" decoding="async" />
    <!-- Awan Bawah Makrab / Atas Gugus (Foto 1) -->
    <img src="assets/background/awan.webp" class="parallax-asset atmos size-lg awan-makrab-left" alt="" width="400" height="200" loading="lazy" decoding="async" />
    <!-- Awan Atas Materi (Foto 2) -->
    <img src="assets/background/awan.webp" class="parallax-asset atmos size-xl awan-materi-right" data-flip="true" style="transform: scaleX(-1);" alt="" width="480" height="240" loading="lazy" decoding="async" />
    
    <!-- 3. Lapisan Bawah (FAQ) - 3 Awan Berbeda Ukuran Berseliweran -->
    <!-- Awan 1: Ukuran Besar (Kiri FAQ) -->
    <img src="assets/background/awan.webp" class="parallax-asset atmos size-xl" style="top: 73%; left: -3%; opacity: 0.9;" alt="" width="480" height="240" loading="lazy" decoding="async" />
    <!-- Awan 2: Ukuran Sedang (Kanan FAQ - Mirrored) -->
    <img src="assets/background/awan.webp" class="parallax-asset atmos size-md" data-flip="true" style="top: 76.5%; right: -2%; opacity: 0.92; transform: scaleX(-1);" alt="" width="320" height="160" loading="lazy" decoding="async" />
    <!-- Awan 3: Ukuran Kecil/Ringan (Tengah-Kiri Menuju Skyline Kota) -->
    <img src="assets/background/awan.webp" class="parallax-asset atmos size-sm" style="top: 80%; left: 15%; opacity: 0.85;" alt="" width="220" height="110" loading="lazy" decoding="async" />
  </div>

  <!-- Sticky Navbar & Scroll Progress -->
  <load src="src/components/navbar.html" />

  <!-- Main Content Landmark -->
  <main id="main-content" role="main">
    <!-- Hero Section -->
    <load src="src/components/hero.html" />

    <!-- Filosofi & Nilai Section -->
    <load src="src/components/filosofi.html" />

    <!-- Video Profil Section -->
    <load src="src/components/video.html" />

    <!-- Rangkaian Acara & Timeline Section -->
    <load src="src/components/timeline.html" />

    <!-- Gugus & Kabim Section -->
    <load src="src/components/gugus.html" />

    <!-- Materi & Modul Pembekalan Section -->
    <load src="src/components/materi.html" />

    <!-- FAQ Section -->
    <load src="src/components/faq.html" />
  </main>

  <!-- City Skyline (Di atas Footer / sekitar bagian FAQ) -->
  <div class="city-skyline-wrapper" aria-hidden="true">
    <div class="city-skyline-bg"></div>
  </div>

  <!-- Footer -->
  <load src="src/components/footer.html" />

  <!-- ESM Application Bootstrap -->
  <script type="module" src="/src/scripts/main.js"></script>
</body>
</html>
